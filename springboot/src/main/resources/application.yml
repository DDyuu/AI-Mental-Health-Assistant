server:
  port: 8080

spring:
  application:
    name: ai-mental-health-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/ai_mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      use-key-prefix: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        retry:
            enabled: true
            max-attempts: 3

# RabbitMQ 配置（默认禁用，启用需安装 RabbitMQ 并设为 true）
app:
  rabbitmq:
    enabled: false

# 文件上传配置
file:
  upload:
    path: uploads

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mentalhealth.assistant.entity
